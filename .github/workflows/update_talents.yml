name: Wekelijkse talent update

on:
  push:
    paths:
      - 'nieuwe_talenten.csv'   # Automatisch bij elke CSV-upload
  workflow_dispatch:             # Ook handmatig te starten

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Benodigde packages installeren
        run: pip install requests

      - name: Script uitvoeren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python update_talents.py
